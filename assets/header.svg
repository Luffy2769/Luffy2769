<svg width="100%" height="160" viewBox="0 0 800 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#070f1e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#021c38" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .glow-border {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .font-mono {
        font-family: 'Consolas', 'Fira Code', 'Monaco', 'Courier New', monospace;
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="796" height="156" rx="14" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" class="glow-border" />

  <!-- Terminal Top Bar -->
  <line x1="2" y1="36" x2="798" y2="36" stroke="#1e293b" stroke-width="1" />
  
  <!-- Terminal Window Controls -->
  <circle cx="22" cy="19" r="5" fill="#ef4444" />
  <circle cx="38" cy="19" r="5" fill="#eab308" />
  <circle cx="54" cy="19" r="5" fill="#22c55e" />

  <!-- Terminal Title -->
  <text x="400" y="23" text-anchor="middle" fill="#64748b" font-size="12" class="font-mono">rootcrypt@raunak: ~/profile</text>

  <!-- Command Line Prompt -->
  <text x="32" y="66" fill="#38bdf8" font-size="14" class="font-mono" font-weight="600">raunak@rootcrypt</text>
  <text x="175" y="66" fill="#64748b" font-size="14" class="font-mono">:</text>
  <text x="185" y="66" fill="#818cf8" font-size="14" class="font-mono">~</text>
  <text x="195" y="66" fill="#64748b" font-size="14" class="font-mono">$</text>
  <text x="212" y="66" fill="#f8fafc" font-size="14" class="font-mono">./greet.sh</text>

  <!-- Main Hero Heading -->
  <text x="32" y="108" fill="url(#textGrad)" font-size="34" font-weight="800" class="font-title" letter-spacing="-0.5">
    Hi there, I'm Raunak
  </text>
  <!-- Animated Blinking Cursor -->
  <rect x="400" y="84" width="10" height="28" fill="#38bdf8" class="cursor" rx="2" />

  <!-- Subtitle Tagline -->
  <text x="32" y="136" fill="#94a3b8" font-size="14" class="font-mono">
    Founder of <tspan fill="#38bdf8" font-weight="600">RootCrypt</tspan> • Full-Stack Engineer (Next.js / Django / Supabase)
  </text>

  <!-- Accent Status Pill (Top Right) -->
  <g transform="translate(680, 10)">
    <rect width="98" height="18" rx="9" fill="#0f172a" stroke="#22c55e" stroke-width="0.75" />
    <circle cx="10" cy="9" r="3" fill="#22c55e" />
    <text x="18" y="12.5" fill="#e2e8f0" font-size="10" class="font-mono">AVAILABLE</text>
  </g>
</svg>
