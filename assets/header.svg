<svg width="100%" height="96" viewBox="0 0 850 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Crimson Red Liquid Gradient Animation -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ff1744">
        <animate attributeName="stop-color" values="#ff1744;#dc2626;#ff4d6d;#b91c1c;#ff1744" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#ef4444">
        <animate attributeName="stop-color" values="#ef4444;#ff4d6d;#b91c1c;#ff1744;#ef4444" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#dc2626">
        <animate attributeName="stop-color" values="#dc2626;#b91c1c;#ff1744;#ef4444;#dc2626" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#ff4d6d">
        <animate attributeName="stop-color" values="#ff4d6d;#ff1744;#ef4444;#dc2626;#ff4d6d" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff1744">
        <animate attributeName="stop-color" values="#ff1744;#dc2626;#ff4d6d;#b91c1c;#ff1744" dur="5s" repeatCount="indefinite" />
      </stop>
      <animate attributeName="x1" from="0%" to="-100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Crimson Neon Glow -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="redOrbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glowing Red Accent Beam Gradient -->
    <linearGradient id="redBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="25%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff1744" stop-opacity="1" />
      <stop offset="75%" stop-color="#dc2626" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulseEmber {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.035em;
        animation: floatSoft 4s ease-in-out infinite;
      }
      .bracket {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 300;
        opacity: 0.45;
      }
      .ember-1 { animation: pulseEmber 2.8s ease-in-out infinite; transform-origin: 180px 42px; }
      .ember-2 { animation: pulseEmber 2.2s ease-in-out infinite 0.8s; transform-origin: 670px 45px; }
      .ember-3 { animation: pulseEmber 3.2s ease-in-out infinite 0.4s; transform-origin: 230px 78px; }
      .ember-4 { animation: pulseEmber 2.6s ease-in-out infinite 1.4s; transform-origin: 620px 78px; }
    </style>
  </defs>

  <!-- Ambient Crimson Embers -->
  <g class="ember-1" fill="#ff1744">
    <path d="M180 38 L181.5 41.5 L185 43 L181.5 44.5 L180 48 L178.5 44.5 L175 43 L178.5 41.5 Z" />
  </g>
  <g class="ember-2" fill="#ff4d6d">
    <path d="M670 41 L671.5 44.5 L675 46 L671.5 47.5 L670 51 L668.5 47.5 L665 46 L668.5 44.5 Z" />
  </g>
  <circle cx="230" cy="78" r="2" fill="#ef4444" class="ember-3" />
  <circle cx="620" cy="78" r="2" fill="#dc2626" class="ember-4" />

  <!-- Subtle Cyber Tech Brackets in Red -->
  <text x="140" y="58" fill="url(#crimsonGrad)" font-size="46" class="bracket">&lt;</text>
  <text x="685" y="58" fill="url(#crimsonGrad)" font-size="46" class="bracket">/&gt;</text>

  <!-- Ambient Glow Text Layer -->
  <text 
    x="425" 
    y="58" 
    text-anchor="middle" 
    fill="url(#crimsonGrad)" 
    font-size="64" 
    class="hero-title"
    filter="url(#crimsonGlow)"
    opacity="0.55"
  >
    Hi, I'm Raunak
  </text>

  <!-- Sharp Foreground Hero Title -->
  <text 
    x="425" 
    y="58" 
    text-anchor="middle" 
    fill="url(#crimsonGrad)" 
    font-size="64" 
    class="hero-title"
  >
    Hi, I'm Raunak
  </text>

  <!-- Glowing Accent Beam Line -->
  <path d="M 230 80 L 620 80" stroke="url(#redBeam)" stroke-width="2" stroke-linecap="round" />

  <!-- Pulsing Center Energy Core in Crimson -->
  <circle cx="425" cy="80" r="3.5" fill="#ff1744" filter="url(#redOrbGlow)">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
