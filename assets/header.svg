<svg width="100%" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Liquid Iridescent Gradient Animation -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#f472b6;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#818cf8;#c084fc;#f472b6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <animate attributeName="x1" from="0%" to="-100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="200%" to="100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Subtle Outer Neon Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glowing Accent Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="75%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <style>
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes beamTravel {
        0% { transform: translateX(-150px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(150px); opacity: 0; }
      }
      .hero-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.035em;
        animation: floatSoft 4s ease-in-out infinite;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 11px;
      }
      .bracket {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 300;
        opacity: 0.35;
      }
      .particle-1 { animation: pulseGlow 3s ease-in-out infinite; transform-origin: 180px 75px; }
      .particle-2 { animation: pulseGlow 2.5s ease-in-out infinite 1.2s; transform-origin: 720px 80px; }
      .particle-3 { animation: pulseGlow 3.5s ease-in-out infinite 0.7s; transform-origin: 240px 135px; }
      .particle-4 { animation: pulseGlow 2.8s ease-in-out infinite 1.8s; transform-origin: 660px 130px; }
    </style>
  </defs>

  <!-- Status Pill Floating at Top -->
  <g transform="translate(450, 26)">
    <!-- Pill Backing (Very subtle dark glass fill with glowing border) -->
    <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#090d16" fill-opacity="0.85" stroke="url(#pillBorder)" stroke-width="1.2" />
    <!-- Live Green Pulse Indicator -->
    <circle cx="-160" cy="0" r="3.5" fill="#10b981" filter="url(#orbGlow)">
      <animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-160" cy="0" r="6" fill="#10b981" opacity="0.3">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Badge Label -->
    <text x="-144" y="3.5" fill="#94a3b8" class="badge-text">
      FOUNDER @ ROOTCRYPT <tspan fill="#38bdf8">•</tspan> FULL-STACK ARCHITECT
    </text>
  </g>

  <!-- Cosmic Ambient Sparkles -->
  <g class="particle-1" fill="#38bdf8">
    <path d="M180 70 L181.5 74 L185.5 75 L181.5 76 L180 80 L178.5 76 L174.5 75 L178.5 74 Z" />
  </g>
  <g class="particle-2" fill="#f472b6">
    <path d="M720 75 L721.5 79 L725.5 80 L721.5 81 L720 85 L718.5 81 L714.5 80 L718.5 79 Z" />
  </g>
  <circle cx="240" cy="135" r="2" fill="#818cf8" class="particle-3" />
  <circle cx="660" cy="130" r="2" fill="#c084fc" class="particle-4" />

  <!-- Subtle Cyber Tech Brackets -->
  <text x="145" y="102" fill="url(#auroraGrad)" font-size="44" class="bracket">&lt;</text>
  <text x="735" y="102" fill="url(#auroraGrad)" font-size="44" class="bracket">/&gt;</text>

  <!-- Ambient Glow Layer for Text -->
  <text 
    x="450" 
    y="102" 
    text-anchor="middle" 
    fill="url(#auroraGrad)" 
    font-size="62" 
    class="hero-title"
    filter="url(#subtleGlow)"
    opacity="0.6"
  >
    Hi, I'm Raunak
  </text>

  <!-- Razor-Sharp Foreground Hero Title -->
  <text 
    x="450" 
    y="102" 
    text-anchor="middle" 
    fill="url(#auroraGrad)" 
    font-size="62" 
    class="hero-title"
  >
    Hi, I'm Raunak
  </text>

  <!-- Glowing Accent Beam Line -->
  <path d="M 230 130 L 670 130" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Center Floating Energy Core -->
  <circle cx="450" cy="130" r="3.5" fill="#38bdf8" filter="url(#orbGlow)">
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Secondary Dynamic Sub-Tagline -->
  <text 
    x="450" 
    y="158" 
    text-anchor="middle" 
    fill="#64748b" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" 
    font-size="13" 
    font-weight="500" 
    letter-spacing="0.18em"
  >
    CRAFTING MODERN DIGITAL EXPERIENCES &amp; DISTRIBUTED SYSTEMS
  </text>
</svg>
